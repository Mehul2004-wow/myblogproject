{% extends 'base.html' %}
{% block content %}
<h2>Create Category</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Submit" class="btn-submit">
</form>
<p class="result-msg">{{ context.result }}</p>
<hr>
<h2>Category List</h2>
<table class="category-table">
   <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Actions</th>
    </tr>
</thead>
    <tbody>
        {% for item in data %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.description }}</td>
            <td>
                <a href="{% url 'edit_category' item.id %}" class="btn-edit">Edit</a>
                <a href="{% url 'delete_category' item.id %}" class="btn-delete">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<style>
body {
    font-family: Arial, sans-serif;
}

/* Form Styling */
h2 {
    color: #333;
    margin-bottom: 10px;
}

form {
    background: #f9f9f9;
    padding: 15px;
    border-radius: 8px;
    width: 50%;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.btn-submit {
    background-color: #28a745;
    color: white;
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.btn-submit:hover {
    background-color: #218838;
}

/* Result Message */
.result-msg {
    color: green;
    font-weight: bold;
    margin-top: 10px;
}

/* Table Styling */
.category-table {
    width: 80%;
    border-collapse: collapse;
    margin-top: 20px;
}

.category-table th, 
.category-table td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

.category-table tr:nth-child(even) {
    background-color: #f2f2f2;
}

.category-table tr:hover {
    background-color: #ddd;
}

.category-table th {
    background-color: #007bff;
    color: white;
}

/* Buttons */
.btn-edit {
    background-color: #ffc107;
    color: black;
    padding: 5px 10px;
    text-decoration: none;
    border-radius: 4px;
}

.btn-edit:hover {
    background-color: #e0a800;
}

.btn-delete {
    background-color: #dc3545;
    color: white;
    padding: 5px 10px;
    text-decoration: none;
    border-radius: 4px;
}

.btn-delete:hover {
    background-color: #c82333;
}
</style>
{% endblock %}
